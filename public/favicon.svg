<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Emerald / Growth Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Gold / Sparkle Accent -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Shadow / Lighting -->
    <linearGradient id="highlightOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle Glass Highlight on Top Edge -->
  <rect x="24" y="24" width="464" height="232" rx="120" fill="url(#highlightOverlay)" />
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Central Emblem: Stylized Financial Organization + Growth 'O' / Wallet / Vault Layers -->
  <!-- Layer 1: Left Pillar / Bar -->
  <rect x="116" y="260" width="56" height="136" rx="20" fill="#FFFFFF" fill-opacity="0.85" />
  
  <!-- Layer 2: Middle Pillar (Higher) -->
  <rect x="196" y="196" width="56" height="200" rx="20" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Layer 3: Right Pillar (Highest - Growth with Emerald Gradient) -->
  <rect x="276" y="132" width="56" height="264" rx="20" fill="url(#emeraldGrad)" />

  <!-- Upward Trend Dynamic Swoop / Balance Arc -->
  <path d="M 96 320 C 180 290 260 210 364 120" stroke="url(#sparkleGrad)" stroke-width="28" stroke-linecap="round" filter="url(#softGlow)" />
  <path d="M 96 320 C 180 290 260 210 364 120" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />

  <!-- AI Intelligence Star / Sparkle (Top Right) -->
  <g transform="translate(380, 108)" filter="url(#softGlow)">
    <!-- 4-point AI Star -->
    <path d="M 0 -48 Q 0 0 48 0 Q 0 0 0 48 Q 0 0 -48 0 Q 0 0 0 -48 Z" fill="#34D399" />
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
  </g>

  <!-- Secondary Mini Sparkle -->
  <g transform="translate(320, 72) scale(0.45)">
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#93C5FD" />
  </g>
</svg>
